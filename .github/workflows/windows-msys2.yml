name: Windows build (MSYS2)

# Manual trigger only: a full KiCad build takes a couple of hours on a hosted runner.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: CMake build type
        default: Release
        type: choice
        options: [Release, RelWithDebInfo, Debug]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # Same dependency set as the MSYS2 kicad package, minus the symbol/footprint
          # libraries and wxPython (scripting is off for this build).
          install: >-
            git
            mingw-w64-x86_64-cc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-doxygen
            mingw-w64-x86_64-swig
            mingw-w64-x86_64-wxwidgets3.2-msw
            mingw-w64-x86_64-abseil-cpp
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-freeglut
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-glm
            mingw-w64-x86_64-nng
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-libgit2
            mingw-w64-x86_64-ngspice
            mingw-w64-x86_64-python
            mingw-w64-x86_64-opencascade
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-unixodbc

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DKICAD_SCRIPTING_WXPYTHON=OFF \
            -DKICAD_BUILD_I18N=OFF \
            -DKICAD_BUILD_QA_TESTS=OFF \
            -DKICAD_USE_SENTRY=OFF \
            -DKICAD_USE_PCH=OFF \
            -DwxWidgets_CONFIG_EXECUTABLE="${MINGW_PREFIX}/bin/wx-config-3.2" \
            -DOCC_INCLUDE_DIR="${MINGW_PREFIX}/include/opencascade"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Install
        run: cmake --install build

      - name: Bundle runtime DLLs
        # Copy every MinGW DLL the executables and kifaces link against, so the
        # zip runs on a machine without MSYS2.
        run: |
          set -e
          bin=install/bin
          copy_deps() {
            ldd "$1" | awk '/mingw64\/bin/ {print $3}' | while read -r dll; do
              cp -n "$dll" "$bin/" 2>/dev/null || true
            done
          }
          for f in "$bin"/*.exe "$bin"/*.dll "$bin"/*.kiface; do
            [ -f "$f" ] && copy_deps "$f"
          done
          # Second pass: DLLs pulled in by the DLLs we just copied.
          for f in "$bin"/*.dll; do
            copy_deps "$f"
          done
          ls "$bin" | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: kicad-tweaks-windows-${{ inputs.build_type }}-${{ github.sha }}
          path: install
          compression-level: 6
